<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gọi Món | PTT Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <div class="bg-image-container"></div>

    <div id="sidebar-placeholder"></div>

    <div class="menu-layout">
        <div class="menu-section">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" onkeyup="searchDish()" class="form-control rounded-pill shadow-sm" placeholder="Tìm món...">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <div class="d-flex gap-2 overflow-auto pb-2 mb-2" id="category_container">
                <div class="cat-chip active" onclick="filterCategory('all', this)">All</div>
            </div>

            <div class="dish-grid" id="menu_container">
                <div class="text-center w-100 mt-5 text-muted">
                    <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                    <p>Đang tải thực đơn...</p>
                </div>
            </div>
        </div>

        <div class="order-section">
            <div class="p-4 border-bottom" style="border-color: rgba(255,255,255,0.1) !important;">
                <h5 class="mb-3 fw-bold">Chi tiết đơn hàng</h5>

                <select id="selectedTable" class="form-select fw-bold border-2 mb-3 text-white" style="border-color: #4e73df; background: rgba(255,255,255,0.1);">
                    <option value="" class="text-dark">-- Chọn Bàn --</option>
                </select>
            </div>

            <div class="flex-grow-1 overflow-auto p-4" id="cart-items">
                <div class="text-center mt-5" style="color: rgba(255,255,255,0.5);">Chưa có món nào</div>
            </div>

            <div class="p-4 border-top" style="border-color: rgba(255,255,255,0.1) !important; background: rgba(0,0,0,0.2);">
                <div class="d-flex justify-content-between fw-bold mb-3 fs-5">
                    <span>Tổng tiền:</span> <span id="cart-total" class="text-primary">0</span>
                </div>
                <button class="btn btn-submit-kitchen w-100" onclick="submitOrder()">
                    <i class="fas fa-paper-plane me-2"></i> GỬI BẾP
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../JS/menu.js"></script>

</body>
</html>
