<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Order | PTT Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/order.css">
</head>
<body>

    <div class="bg-image-container"></div>

    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div class="top-bar">
            <h2 class="fw-bold m-0" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Quản lý Order</h2>
            <div class="search-group">
                <div class="search-box">
                    <input type="text" id="searchInput" onkeyup="searchOrder()" placeholder="Tìm số bàn...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
        </div>

        <div class="order-grid" id="orderGrid">
            <div class="text-center w-100 pt-5 text-muted">
                <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
                <p>Đang tải danh sách Order...</p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../JS/order-list.js"></script>
</body>
</html>
